# CI do app (ADR-0012: verificação automática antes do revisor).
#
# Roda lint + typecheck + testes + build em pull request e push para master — sem isto,
# quebra só aparece depois do merge. Os testes rodam no Node, sem banco nem rede.
# O build recebe env de placeholder porque src/shared/lib/env.ts valida as
# variáveis no boot — sem elas o próprio `next build` falha. DATA_SOURCE=mock: o CI
# não tem banco; o segredo abaixo é só do CI e não assina sessão de ninguém real.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Push novo no mesmo PR cancela a execução anterior: o resultado antigo já não
# descreve o código que está sendo revisado.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
        env:
          DATA_SOURCE: mock
          AUTH_SECRET: ci-placeholder-nao-assina-sessao-real-0123456789
