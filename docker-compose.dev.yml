# Banco local que imita o essencial do Supabase: Postgres + PostgREST atrás de um gateway em
# /rest/v1, que é o caminho que o supabase-js usa. Só para desenvolvimento: senhas fixas,
# portas só em localhost.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - editaliza-db:/var/lib/postgresql/data
      - ./docker/dev/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon

  # O supabase-js manda "Authorization: Bearer <chave>". O PostgREST sem segredo JWT recusa
  # qualquer token, então o gateway o remove e a requisição segue como o papel anon.
  gateway:
    image: nginx:alpine
    depends_on:
      - postgrest
    ports:
      - "127.0.0.1:54321:80"
    volumes:
      - ./docker/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  editaliza-db:
